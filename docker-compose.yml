services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://user:password@db:5432/mydb?sslmode=disable
      MONGO_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-dateplan}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_MAP_API_KEY: ${GOOGLE_MAP_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

volumes:
  pgdata:
  mongodb_data:
    name: mongodb_data
    driver: local

networks:
  app_network:
    driver: bridge
